name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify annotated release tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object | select(.type == "tag") | .sha')"
          test -n "${tag_sha}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')" = true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Activate the integrity-pinned package manager
        run: corepack enable

      - name: Scan reachable source history for secrets
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --log-opts=HEAD .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build
        run: |
          pnpm test
          pnpm test:bundle

      - name: Package and verify VSIX
        id: artifact
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          pnpm package:vsix
          vsix="dist/beginningdb-cloudfs-${version}.vsix"
          pnpm verify:vsix -- "${vsix}"
          vsix_basename="$(basename "${vsix}")"
          (cd dist && shasum -a 256 "${vsix_basename}" > "${vsix_basename}.sha256")
          echo "vsix=${vsix}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.artifact.outputs.vsix }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${VSIX}" \
            "${VSIX}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "BeginningDB Cloud Files ${GITHUB_REF_NAME}"
